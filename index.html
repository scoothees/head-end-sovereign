<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HEAD-END // 04</title>
  <style>
    :root {
      --bg: #020d1f;
      --bg-deep: #010812;
      --blue-outer: #4a87d8;
      --blue-inner: #7ec8ff;
      --panel: #0a1b2d;
      --panel-2: #091a2c;
      --panel-3: #0e2240;
      --cyan: #8ae8ff;
      --cyan-deep: #66d8ff;
      --gold: #f5d15f;
      --gold-2: #e8b241;
      --white: #f2f5f9;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at center, rgba(40, 80, 126, 0.55), transparent 38%),
        linear-gradient(180deg, #020d1f 0%, #010812 100%);
      color: var(--white);
      font-family: "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: auto;
    }

    .gallery {
      width: min(90vw, 620px);
      display: grid;
      gap: 18px;
      padding: 20px 0;
    }

    .scene {
      position: relative;
      width: min(100%, 540px);
      aspect-ratio: 1.1;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(13, 28, 42, 0.95), rgba(7, 15, 29, 0.95));
      border: 3px solid var(--blue-outer);
      box-shadow: inset 0 0 0 2px rgba(15, 26, 42, 0.9), 0 0 0 1px rgba(0,0,0,0.35);
      display: grid;
      place-items: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 3px solid rgba(255,255,255,0.92);
      background: rgba(8, 18, 29, 0.4);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 42px;
      border: 3px solid var(--blue-inner);
      background: rgba(10, 26, 43, 0.8);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2);
    }

    .signal {
      position: relative;
      width: 42%;
      aspect-ratio: 1;
      background: rgba(16, 40, 64, 0.9);
      border: 3px solid var(--blue-inner);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
      z-index: 2;
    }

    .signal::before,
    .signal::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cyan);
      border: 2px solid rgba(0, 0, 0, 0.15);
    }

    .signal::before {
      width: 30%;
      height: 30%;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(138, 239, 255, 0.9);
    }

    .signal::after {
      width: 38%;
      height: 20%;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 209, 95, 0.9);
      border-color: rgba(0,0,0,0.15);
    }

    .digit {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(245, 209, 95, 0.4);
      z-index: 3;
      letter-spacing: 0.06em;
    }

    .scene:nth-child(2) .signal {
      width: 36%;
      transform: translateY(-8px);
    }

    .scene:nth-child(3) .signal {
      width: 46%;
      transform: translateY(-6px);
    }

    .scene:nth-child(1) .signal::before { left: 50%; }
    .scene:nth-child(2) .signal::before { left: 50%; }
    .scene:nth-child(3) .signal::before { left: 50%; }

    @media (max-width: 520px) {
      .gallery { width: 96vw; gap: 14px; }
      .scene { aspect-ratio: 1.08; }
      .scene::before { inset: 12px; }
      .scene::after { inset: 30px; }
      .digit { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="gallery" aria-label="HEAD-END art study">
    <div class="scene" aria-label="art frame 1">
      <div class="signal" aria-hidden="true"></div>
      <div class="digit">04</div>
    </div>

    <div class="scene" aria-label="art frame 2">
      <div class="signal" aria-hidden="true"></div>
      <div class="digit">04</div>
    </div>

    <div class="scene" aria-label="art frame 3">
      <div class="signal" aria-hidden="true"></div>
      <div class="digit">04</div>
    </div>
  </div>
</body>
</html>
